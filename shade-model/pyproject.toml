[project]
name = "shade-model"
version = "0.1.0"
description = "Sun and shade times for climbing sectors, from public elevation data"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "lxml>=5.3",
    "numpy>=2.1",
    "pandas>=2.2",
    "pvlib>=0.11",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "scipy>=1.14",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9"]

[project.scripts]
shade = "shademodel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shademodel"]

[dependency-groups]
dev = [
    "piexif>=1.1.3",
    "pytest>=9.1.1",
]
