name: DNS Plan (Terraform)

on:
  workflow_call:
    inputs:
      vps_manager_repo:
        description: "Owner/Repo of vps-manager containing Terraform code"
        required: false
        type: string
        default: "yarden-zamir/vps-manager"
      records_json:
        description: "JSON string with { records: [...] } matching dns/terraform schema"
        required: false
        type: string
      records_path:
        description: "Path in caller repo to a JSON file containing { records: [...] }"
        required: false
        type: string
      dns_provider:
        description: "DNS provider to target (netlify|cloudflare|digitalocean|linode)"
        required: true
        type: string
      state_path:
        description: "Path in caller repo to store terraform state"
        required: false
        type: string
        default: ".dns-tfstate/terraform.tfstate"
    secrets:
      DNS_PROVIDER_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Checkout vps-manager repo (Terraform code)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.vps_manager_repo }}
          path: vps-manager

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Use records from path
        if: ${{ inputs.records_path != '' }}
        run: |
          # Extract netlify_team_slug if present in JSON
          if [ -f "${{ inputs.records_path }}" ]; then
            TEAM_SLUG=$(jq -r '.netlify_team_slug // empty' "${{ inputs.records_path }}" || echo "")
            if [ -n "$TEAM_SLUG" ]; then
              echo "NETLIFY_TEAM_SLUG_FROM_JSON=$TEAM_SLUG" >> $GITHUB_ENV
            fi
            # Remove netlify_team_slug from JSON before copying to Terraform
            jq 'del(.netlify_team_slug)' "${{ inputs.records_path }}" > vps-manager/dns/terraform/records.auto.tfvars.json
          else
            cp "${{ inputs.records_path }}" vps-manager/dns/terraform/records.auto.tfvars.json
          fi

      - name: Write records.auto.tfvars.json (inline)
        if: ${{ inputs.records_path == '' && inputs.records_json != '' }}
        run: |
          # Extract netlify_team_slug if present in inline JSON
          echo '${{ inputs.records_json }}' > temp_records.json
          TEAM_SLUG=$(jq -r '.netlify_team_slug // empty' temp_records.json || echo "")
          if [ -n "$TEAM_SLUG" ]; then
            echo "NETLIFY_TEAM_SLUG_FROM_JSON=$TEAM_SLUG" >> $GITHUB_ENV
          fi
          # Remove netlify_team_slug from JSON before writing to Terraform
          jq 'del(.netlify_team_slug)' temp_records.json > vps-manager/dns/terraform/records.auto.tfvars.json
          rm temp_records.json

      - name: Ensure state dir
        run: |
          mkdir -p "$(dirname '${{ inputs.state_path }}')"

      - name: Terraform Init
        env:
          TF_VAR_dns_provider: ${{ inputs.dns_provider }}
          TF_VAR_dns_provider_token: ${{ secrets.DNS_PROVIDER_TOKEN }}
          TF_VAR_netlify_team_slug: ${{ env.NETLIFY_TEAM_SLUG_FROM_JSON || vars.NETLIFY_TEAM_SLUG || '' }}
        run: |
          terraform -chdir=vps-manager/dns/terraform init -input=false -reconfigure -backend-config="path=${{ github.workspace }}/${{ inputs.state_path }}"

      - name: Terraform Plan
        env:
          TF_VAR_dns_provider: ${{ inputs.dns_provider }}
          TF_VAR_dns_provider_token: ${{ secrets.DNS_PROVIDER_TOKEN }}
          TF_VAR_netlify_team_slug: ${{ env.NETLIFY_TEAM_SLUG_FROM_JSON || vars.NETLIFY_TEAM_SLUG || '' }}
        run: |
          terraform -chdir=vps-manager/dns/terraform plan -input=false -no-color

      
