name: Deploy to VPS

on:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: ${{ vars.APP_NAME || github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create app directory
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: mkdir -p /apps/${{ env.APP_NAME }}

    - name: Clear existing files
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: rm -rf /apps/${{ env.APP_NAME }}/{*,.[!.]*,..?*}

    - name: Copy files to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "./"
        target: "/apps/${{ env.APP_NAME }}"
        overwrite: true

    - name: Create environment file
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        envs: APP_NAME,APP_DOMAIN,APP_PORT,COMMIT_SHA
        script: |
          cd /apps/$APP_NAME
          : > .env
          echo "NODE_ENV=production" >> .env
          echo "ENVIRONMENT=production" >> .env
          echo "APP_NAME=$APP_NAME" >> .env
          echo "APP_DOMAIN=$APP_DOMAIN" >> .env
          echo "APP_PORT=$APP_PORT" >> .env
          echo "PORT=$APP_PORT" >> .env
          echo "COMMIT_SHA=$COMMIT_SHA" >> .env
      env:
        APP_NAME: ${{ env.APP_NAME }}
        APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        APP_PORT: ${{ vars.APP_PORT }}
        COMMIT_SHA: ${{ github.sha }}

    - name: Prepare and restart native service
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        envs: APP_NAME
        script: |
          set -e
          cd /apps/$APP_NAME
          chmod +x bin/start
          if command -v make >/dev/null 2>&1; then
            make deploy-prepare
          fi
          sudo systemctl restart $APP_NAME.service
      env:
        APP_NAME: ${{ env.APP_NAME }}

    - name: Wait for health check
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        envs: APP_NAME,APP_PORT
        script: |
          set -e
          echo "Waiting for $APP_NAME to be healthy on localhost:$APP_PORT..."
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:$APP_PORT/health" >/dev/null; then
              echo "Service is healthy"
              exit 0
            fi
            if ! sudo systemctl is-active $APP_NAME.service >/dev/null; then
              echo "Service is not active"
              sudo journalctl -u $APP_NAME.service -n 100 --no-pager
              exit 1
            fi
            sleep 2
          done
          echo "Service failed to become healthy"
          sudo journalctl -u $APP_NAME.service -n 100 --no-pager
          exit 1
      env:
        APP_NAME: ${{ env.APP_NAME }}
        APP_PORT: ${{ vars.APP_PORT }}

    - name: Verify public HTTPS
      if: ${{ vars.APP_DOMAIN != '' }}
      env:
        APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      run: |
        echo "Waiting for HTTPS at https://$APP_DOMAIN ..."
        success=false
        for i in {1..90}; do
          if curl -sS -I --max-time 10 --location https://$APP_DOMAIN | head -n1 | grep -E 'HTTP/.+ (2|3)[0-9][0-9]' > /dev/null; then
            echo "HTTPS reachable for $APP_DOMAIN"
            success=true
            break
          fi
          sleep 3
        done
        if [ "$success" != true ]; then
          echo "Timed out waiting for HTTPS at https://$APP_DOMAIN"
          exit 1
        fi
